<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>揚森的專屬日本購物推薦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 隱藏原生捲軸，打造 App 感 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { 
            overflow-x: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #F5F5F7; 
            -webkit-tap-highlight-color: transparent;
        }
        /* 毛玻璃效果 */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* 頂級柔和陰影 */
        .shadow-premium {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 2px 10px rgba(0, 0, 0, 0.02);
        }
        /* 平滑動畫過渡 */
        .transition-all-spring {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fade-enter {
            opacity: 0; transform: translateY(10px); animation: fadeInUp 0.5s forwards;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        /* 避免長按選取 */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="text-[#1D1D1F] antialiased">

    <div id="app" class="w-full max-w-md mx-auto bg-[#F5F5F7] min-h-screen relative flex flex-col">
        
        <!-- 頂部導覽列 (毛玻璃) -->
        <header class="glass sticky top-0 z-40 px-5 pt-6 pb-3 border-b border-gray-200/50 shadow-sm">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span id="sync-status" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                        <p id="sync-text" class="text-xs font-semibold text-slate-500 uppercase tracking-widest">連線中...</p>
                    </div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">揚森的專屬日本購物推薦</h1>
                </div>
                <!-- 後台切換按鈕 (齒輪) -->
                <button onclick="window.toggleView()" id="view-toggle-btn" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <!-- 分類切換 (兩大分頁：藥妝 / 食物) -->
            <div class="bg-slate-200/60 p-1 rounded-2xl flex relative gap-1" id="tab-container">
                <button onclick="window.switchTab('drugstore')" id="tab-drugstore" class="relative z-10 flex-1 py-3 text-lg font-bold rounded-xl text-center transition-colors text-slate-900 bg-white shadow-sm whitespace-nowrap">
                    💊 藥妝
                </button>
                <button onclick="window.switchTab('food')" id="tab-food" class="relative z-10 flex-1 py-3 text-lg font-bold rounded-xl text-center transition-colors text-slate-500 whitespace-nowrap">
                    🍱 食物
                </button>
            </div>
            
            <!-- 極簡進度條 -->
            <div class="mt-4 flex items-center gap-3" id="progress-container">
                <div class="flex-1 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-slate-800 rounded-full transition-all duration-700 ease-out" style="width: 0%;"></div>
                </div>
                <span id="progress-text" class="text-sm font-bold text-slate-500 w-12 text-right">0%</span>
            </div>
        </header>

        <!-- 視圖 1：清單瀏覽區 -->
        <main id="list-view" class="flex-1 flex flex-col h-full p-4 pb-32">
            <!-- 尚未購買區 -->
            <div id="active-list" class="space-y-6"></div>
            
            <!-- 空白狀態 (無商品時顯示) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-slate-400">
                <i class="fa-solid fa-box-open text-6xl mb-4 text-slate-300"></i>
                <p class="text-lg font-medium">這個分類還沒有任務喔</p>
            </div>

            <!-- 已完成區塊 -->
            <div id="completed-section" class="hidden mt-12 pt-8 border-t border-slate-200/60">
                <h3 class="text-lg font-bold text-slate-400 mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-check-circle"></i> 已購入項目
                </h3>
                <div id="completed-list" class="space-y-4 opacity-75"></div>
            </div>
        </main>

        <!-- 視圖 2：新增商品後台 -->
        <main id="admin-view" class="hidden flex-1 p-5 pb-24 bg-[#F5F5F7]">
            <h2 class="text-2xl font-extrabold mb-6 flex items-center gap-2 text-slate-800">
                <i class="fa-solid fa-pen-to-square"></i> 新增購物任務
            </h2>
            <form id="add-form" class="space-y-6" onsubmit="window.handleAddSubmit(event)">
                
                <!-- 分類選擇 -->
                <div class="bg-white p-5 rounded-3xl shadow-premium">
                    <label class="block text-base font-bold text-slate-700 mb-3">選擇分類</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer no-select">
                            <input type="radio" name="category" value="drugstore" class="peer sr-only" checked>
                            <div class="text-center py-3.5 rounded-2xl bg-slate-50 text-slate-500 font-bold peer-checked:bg-slate-800 peer-checked:text-white transition-colors">💊 藥妝</div>
                        </label>
                        <label class="cursor-pointer no-select">
                            <input type="radio" name="category" value="food" class="peer sr-only">
                            <div class="text-center py-3.5 rounded-2xl bg-slate-50 text-slate-500 font-bold peer-checked:bg-slate-800 peer-checked:text-white transition-colors">🍱 食物</div>
                        </label>
                    </div>
                </div>

                <!-- 輸入區塊 -->
                <div class="bg-white p-5 rounded-3xl shadow-premium space-y-5">
                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-2">商品名稱 <span class="text-red-500">*</span></label>
                        <input type="text" id="input-name" required placeholder="例如：一蘭拉麵泡麵 或 合力他命" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:bg-white transition-all">
                    </div>

                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-2">圖片網址 <span class="text-slate-400 text-sm font-normal">(圖片網址結尾建議為 .jpg 或 .png)</span></label>
                        <input type="url" id="input-image" placeholder="貼上商品圖片連結" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:bg-white transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-base font-bold text-slate-700 mb-2">當地價 (日幣)</label>
                            <input type="text" id="input-local-price" placeholder="例如: 1500" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:bg-white transition-all">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-700 mb-2">參考價 (台幣)</label>
                            <input type="text" id="input-tw-price" placeholder="例如: 350" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:bg-white transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-base font-bold text-slate-700 mb-2">備註說明</label>
                        <input type="text" id="input-target" placeholder="例如：要在唐吉訶德買才有喔！" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:bg-white transition-all">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold text-xl py-4 rounded-2xl shadow-lg shadow-slate-300 transition-transform active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> 加入Google表格
                </button>
            </form>
        </main>

        <!-- 精品風提示框 (Toast) -->
        <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur text-white px-6 py-4 rounded-full opacity-0 pointer-events-none transition-all duration-300 z-50 text-lg font-bold shadow-2xl whitespace-nowrap flex items-center gap-3">
            <i class="fa-solid fa-circle-check text-green-400 text-xl"></i>
            <span id="toast-msg">提示訊息</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔴 請確保這裡是你正確的 Google Apps Script 網址 🔴
        // ==========================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSvgsdSPMHrXAJ9nHviTJB9ShTjY9Fn9Eby6wP6DJuljWMVwyGEtXuSKa2_Z7LRWz-/exec"; 

        window.products = [];
        window.currentTab = 'drugstore';
        window.isAdminView = false;
        let isFetching = false;

        // 初始化：從 Google 表格載入資料
        async function initGoogleSheet() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("請在這裡貼上")) {
                setSyncStatus('error', '尚未設定網址');
                window.showToast('請先在程式碼中填寫 SCRIPT_URL');
                return;
            }

            setSyncStatus('syncing', '載入資料中...');
            
            try {
                const response = await fetch(SCRIPT_URL, { redirect: 'follow' });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                window.products = Array.isArray(data) ? data : [];
                setSyncStatus('success', 'Google 表格已連線');
                window.renderList();

            } catch (error) {
                console.error("載入失敗:", error);
                setSyncStatus('error', '連線失敗');
                window.showToast('無法讀取表格，請檢查發布權限是否為所有人');
            }
        }

        function setSyncStatus(status, text) {
            const statusEl = document.getElementById('sync-status');
            const textEl = document.getElementById('sync-text');
            textEl.innerText = text;
            
            statusEl.className = 'inline-block w-2.5 h-2.5 rounded-full';
            if (status === 'syncing') {
                statusEl.classList.add('bg-amber-400', 'animate-pulse');
            } else if (status === 'success') {
                statusEl.classList.add('bg-emerald-500', 'shadow-[0_0_8px_rgba(16,185,129,0.5)]');
            } else {
                statusEl.classList.add('bg-red-500');
            }
        }

        window.toggleView = function() {
            window.isAdminView = !window.isAdminView;
            const listView = document.getElementById('list-view');
            const adminView = document.getElementById('admin-view');
            const toggleBtn = document.getElementById('view-toggle-btn');
            const tabContainer = document.getElementById('tab-container');
            
            if (window.isAdminView) {
                listView.classList.add('hidden');
                adminView.classList.remove('hidden');
                tabContainer.classList.add('opacity-0', 'pointer-events-none');
                toggleBtn.innerHTML = '<i class="fa-solid fa-xmark text-xl"></i>';
                toggleBtn.classList.replace('bg-white', 'bg-red-50');
                toggleBtn.classList.replace('text-slate-600', 'text-red-600');
            } else {
                adminView.classList.add('hidden');
                tabContainer.classList.remove('opacity-0', 'pointer-events-none');
                toggleBtn.innerHTML = '<i class="fa-solid fa-gear"></i>';
                toggleBtn.classList.replace('bg-red-50', 'bg-white');
                toggleBtn.classList.replace('text-red-600', 'text-slate-600');
                listView.classList.remove('hidden');
            }
        };

        window.switchTab = function(tabId) {
            window.currentTab = tabId;
            const tabs = ['drugstore', 'food'];
            
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (t === tabId) {
                    el.classList.add('bg-white', 'shadow-sm', 'text-slate-900');
                    el.classList.remove('text-slate-500');
                } else {
                    el.classList.remove('bg-white', 'shadow-sm', 'text-slate-900');
                    el.classList.add('text-slate-500');
                }
            });
            window.renderList();
        };

        async function sendToGoogleSheet(payload) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        window.toggleBought = async function(id) {
            if (isFetching) return;
            const productIndex = window.products.findIndex(p => p.id === id);
            if (productIndex === -1) return;

            const newBoughtState = !window.products[productIndex].bought;
            window.products[productIndex].bought = newBoughtState;
            window.renderList();
            
            if (newBoughtState) window.showToast('✅ 已移至下方清單');
            else window.showToast('↩️ 已復原');

            isFetching = true;
            try {
                await sendToGoogleSheet({ action: 'update', id: id, bought: newBoughtState });
            } catch (error) {
                window.showToast('同步失敗');
                window.products[productIndex].bought = !newBoughtState;
                window.renderList();
            } finally {
                isFetching = false;
            }
        };

        window.handleAddSubmit = async function(event) {
            event.preventDefault();
            if (isFetching) return;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 寫入表格中...';
            isFetching = true;

            const selectedCategory = document.querySelector('input[name="category"]:checked').value;
            
            const newProductData = {
                action: 'add',
                category: selectedCategory,
                name: document.getElementById('input-name').value.trim(),
                image: document.getElementById('input-image').value.trim(),
                localPrice: document.getElementById('input-local-price').value.trim(),
                twPrice: document.getElementById('input-tw-price').value.trim(),
                target: document.getElementById('input-target').value.trim(),
            };

            try {
                const result = await sendToGoogleSheet(newProductData);
                if (result && result.success) {
                    window.products.push({ id: result.id, bought: false, ...newProductData });
                    document.getElementById('add-form').reset();
                    window.toggleView(); 
                    window.switchTab(selectedCategory);
                    window.showToast('📝 成功寫入 Google 表格！');
                } else {
                    throw new Error(result.error || "未知錯誤");
                }
            } catch (error) {
                window.showToast('寫入失敗');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> 加入Google表格';
                isFetching = false;
            }
        };

        window.deleteItem = async function(id) {
            if(confirm("確定要從 Google 表格永久刪除此項目嗎？")) {
                const productIndex = window.products.findIndex(p => p.id === id);
                if (productIndex === -1) return;

                const backupProduct = window.products[productIndex];
                window.products.splice(productIndex, 1);
                window.renderList();
                
                isFetching = true;
                try {
                    await sendToGoogleSheet({ action: 'delete', id: id });
                    window.showToast('🗑️ 已永久刪除');
                } catch(e) {
                    window.showToast('刪除失敗');
                    window.products.splice(productIndex, 0, backupProduct);
                    window.renderList();
                } finally {
                    isFetching = false;
                }
            }
        };

        window.renderList = function() {
            const activeContainer = document.getElementById('active-list');
            const completedContainer = document.getElementById('completed-list');
            const completedSection = document.getElementById('completed-section');
            const emptyState = document.getElementById('empty-state');
            
            if(!activeContainer || !completedContainer) return; 

            activeContainer.innerHTML = '';
            completedContainer.innerHTML = '';
            
            let filteredProducts = window.products.filter(p => p.category === window.currentTab);
            filteredProducts.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            const activeProducts = filteredProducts.filter(p => !p.bought);
            const completedProducts = filteredProducts.filter(p => p.bought);
            
            if (activeProducts.length === 0 && filteredProducts.length > 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                activeProducts.forEach(product => activeContainer.appendChild(createCard(product)));
            }

            if (completedProducts.length > 0) {
                completedSection.classList.remove('hidden');
                completedProducts.forEach(product => completedContainer.appendChild(createCard(product)));
            } else {
                completedSection.classList.add('hidden');
            }

            updateProgress();
        };

        function createCard(product) {
            const card = document.createElement('div');
            const defaultImg = 'https://images.unsplash.com/photo-1584308666744-24d5e4708e13?auto=format&fit=crop&q=80&w=800';
            const imgSrc = product.image ? product.image : defaultImg;
            
            card.className = `bg-white rounded-[32px] shadow-premium overflow-hidden fade-enter relative transition-all-spring ${product.bought ? 'scale-[0.97] opacity-75' : ''}`;
            card.innerHTML = `
                <div class="w-full h-64 bg-white relative p-4 border-b border-slate-50 flex items-center justify-center" ${product.bought ? `ondblclick="window.deleteItem('${product.id}')"` : ''}>
                    <img src="${imgSrc}" alt="${product.name}" class="max-h-full max-w-full object-contain" onerror="this.src='${defaultImg}'">
                    ${product.bought ? `<div class="absolute inset-0 bg-white/60 backdrop-blur-[2px]"></div>` : ''}
                </div>
                
                <div class="p-6">
                    <h3 class="text-3xl font-extrabold text-slate-900 leading-tight mb-4">${product.name}</h3>
                    
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${product.localPrice ? `<span class="bg-slate-100 text-slate-800 px-4 py-1.5 rounded-full text-base font-bold">日幣 ${product.localPrice}</span>` : ''}
                        ${product.twPrice ? `<span class="bg-slate-50 text-slate-400 px-4 py-1.5 rounded-full text-base font-medium line-through">台幣約 ${product.twPrice}</span>` : ''}
                    </div>
                    
                    ${product.target ? `
                    <div class="mb-6 bg-amber-50/50 border border-amber-100 p-4 rounded-2xl text-lg text-slate-700 font-medium flex gap-3 items-start">
                        <i class="fa-solid fa-thumbtack mt-1 text-amber-500"></i>
                        <p>${product.target}</p>
                    </div>` : ''}

                    <button onclick="window.toggleBought('${product.id}')" class="w-full py-5 rounded-2xl text-xl font-bold flex items-center justify-center gap-2 transition-all-spring no-select ${product.bought ? 'bg-slate-100 text-slate-500 active:bg-slate-200' : 'bg-[#1D1D1F] text-white shadow-[0_8px_20px_rgba(29,29,31,0.25)] active:scale-[0.98]'}">
                        ${product.bought ? '<i class="fa-solid fa-rotate-left"></i> 復原 (雙擊圖片可刪除)' : '<i class="fa-solid fa-check"></i> 買到了！(點擊打勾)'}
                    </button>
                </div>
            `;
            return card;
        }

        function updateProgress() {
            const filteredProducts = window.products.filter(p => p.category === window.currentTab);
            const total = filteredProducts.length;
            const boughtCount = filteredProducts.filter(p => p.bought).length;
            const percentage = total === 0 ? 0 : Math.round((boughtCount / total) * 100);
            
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            progressBar.style.width = `${percentage}%`;
            progressText.innerText = `${percentage}%`;
            
            if (percentage === 100 && total > 0) {
                progressBar.classList.replace('bg-slate-800', 'bg-emerald-600');
                progressText.classList.add('text-emerald-600');
                progressText.classList.remove('text-slate-500');
            } else {
                progressBar.classList.replace('bg-emerald-600', 'bg-slate-800');
                progressText.classList.remove('text-emerald-600');
                progressText.classList.add('text-slate-500');
            }
        }

        let toastTimeout;
        window.showToast = function(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -20px)';
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 2500);
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            initGoogleSheet();
        });
    </script>
</body>
</html>
